services:
  pp-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pp-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8080}:8080"  # MCP server – host port variable, container port fixed at 8080
    volumes:
      # Variant A (default): mount a single portfolio file read-only.
      # Set the host path via PP_HOST_FILE in .env (default below).
      - "${PP_HOST_FILE:-/path/to/your.portfolio}:/data/portfolio.portfolio:ro"
      # Variant B (multi-source): mount a directory with all .portfolio files
      # + JSON config read-only. Set PP_PORTFOLIOS_CONFIG below and remove the
      # PP_HOST_FILE line above if needed.
      # - "${PP_HOST_PORTFOLIOS_DIR:-/path/to/portfolios}:/data/portfolios:ro"
      # - "${PP_HOST_PORTFOLIOS_CONFIG:-./portfolios.json}:/data/portfolios.json:ro"
    environment:
      - TZ=Europe/Berlin
      - PP_FILE_PATH=/data/portfolio.portfolio
      - PP_PASSWORD=${PP_PASSWORD:-}
      # Set for multi-source (variant B) – takes precedence over PP_FILE_PATH/PP_PASSWORD:
      # - PP_PORTFOLIOS_CONFIG=/data/portfolios.json
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('localhost',8080)))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # For running behind a shared nginx proxy: enable the network and
    # uncomment the networks section below.
    # networks:
    #   - nginx

# networks:
#   nginx:
#     external: true
