services:
  pp-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # UID/GID of the host user that has access to PP_HOST_PORTFOLIOS_DIR
        # per the Synology ACL (adjust the default to match your own NAS setup).
        MCPUSER_UID: ${MCPUSER_UID:-1026}
        MCPUSER_GID: ${MCPUSER_GID:-100}
    container_name: pp-mcp-server
    ports:
      # Bound to the NAS's localhost only (debug/direct access from the NAS shell).
      # Public reachability goes through nginx-proxy-manager (network "nginx"
      # below), not via an additional host port.
      - "127.0.0.1:${MCP_SERVER_PORT:-8080}:8080"
    volumes:
      # Directory with all .portfolio files (read-only).
      - "${PP_HOST_PORTFOLIOS_DIR:-/volume1/PortfolioPerformance}:/data/portfolios:ro"
      # JSON config with the configured sources (read-only).
      - "${PP_HOST_PORTFOLIOS_CONFIG:-./portfolios.json}:/data/portfolios.json:ro"
    environment:
      - TZ=Europe/Berlin
      - PP_PORTFOLIOS_CONFIG=/data/portfolios.json
      # Must stay 0.0.0.0 inside the container – otherwise the port mapping
      # above and the nginx-proxy-manager network below can't reach it. The
      # app's own default is 127.0.0.1 (least exposure for non-Docker runs).
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_TRANSPORT=${MCP_TRANSPORT:-streamable-http}
      # Required in this deployment (not on a trusted local Mac network) –
      # Compose fails if the variable is missing or empty.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in .env}
      # Extra safeguard at the application level: the server also refuses to
      # start (even without Compose) if MCP_AUTH_TOKEN is unset.
      - MCP_REQUIRE_AUTH=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('localhost',8080)))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pp-mcp-net
      - nginx

networks:
  # Shared internal network for backends that need to talk to pp-mcp
  # (future dashboard backend, migrated DividendenTracker backend).
  pp-mcp-net:
    external: true
  # Network of nginx-proxy-manager – required so NPM can reach pp-mcp by
  # container name (pp-mcp-server:8080) as a proxy target. Access is still
  # only possible through the endpoint protected by MCP_AUTH_TOKEN and the
  # host configured in NPM.
  nginx:
    external: true
